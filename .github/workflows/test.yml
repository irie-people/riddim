# go vet and go test on Linux and macOS, for every push to main and every pull request, with the Go version go.mod
# names: the latest 1.27.x that setup-go finds, looking first in the runner's own tool cache.
#
# The tests run with -short, which skips the tests that time wall-clock work: TestCheckSpeed, the M4
# budget of 200 ms for `riddim check` on a 10,000-line program (DESIGN §10.1), and TestPrescanLinear.
# GitHub's shared runners (4 CPUs on Linux, 3 M1 cores on macOS, each a new virtual machine) are slower
# and noisier than a developer's machine, so a wall-clock budget would fail there at random, and a check
# that fails at random teaches everyone to rerun it. -short skips nothing else: the tests that read Go
# packages from the installation, TestShallowImportMatchesSource among them, run on both systems. The
# budget stays enforced where it can be measured: `go test ./...` on a developer's machine, without
# -short.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The standard library is Riddim's only dependency, so there is no go.sum to key a cache on.
          cache: false
      - run: go vet ./...
      - run: go test -short ./...
