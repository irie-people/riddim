<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Riddim's mark: five gold bars of a rhythm, on ink. A riddim is the
       rhythm a song is built on. -->
  <rect width="64" height="64" rx="14" fill="#1F1F24"/>
  <g fill="#F2B544">
    <rect x="11.5" y="27" width="5" height="10" rx="2.5"/>
    <rect x="20.5" y="19" width="5" height="26" rx="2.5"/>
    <rect x="29.5" y="12" width="5" height="40" rx="2.5"/>
    <rect x="38.5" y="22" width="5" height="20" rx="2.5"/>
    <rect x="47.5" y="28" width="5" height="8" rx="2.5"/>
  </g>
</svg>
